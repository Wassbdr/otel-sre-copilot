metadata:
  scenario_id: recommendationservice-cpu_stress-seed42
  fault_service: recommendationservice
  fault_type: cpu_stress
  seed: 42
  fault_duration_s: 300
  window_extra_s: 60
  namespace: otel-demo
  description: >
    CPU stress on recommendationservice (80% CPU usage on 1 core).
    Expected signal: CPU usage spike, latency increase, possible timeout errors.
    Note: requires container_cpu_usage_seconds_total metric to be available.

chaos_manifest:
  apiVersion: chaos-mesh.org/v1alpha1
  kind: StressChaos
  metadata:
    name: recommendationservice-cpu-stress-seed42
    namespace: chaos-mesh
  spec:
    mode: all
    selector:
      namespaces:
        - otel-demo
      labelSelectors:
        app: recommendationservice
    stressors:
      cpu:
        workers: 1
        load: 80
    duration: "300s"
