metadata:
  scenario_id: cart-memory_stress-seed42
  fault_service: cart
  fault_type: memory_stress
  seed: 42
  fault_duration_s: 300
  window_extra_s: 60
  # Stress saturates this host; snapshot at peak load OOM-crashes Prometheus. Settle after
  # recovery before the query burst (data is retained). See ADR-006.
  snapshot_settle_s: 90
  namespace: otel-demo
  description: >
    Memory stress on cart (256MB allocation). Self-relative gate (ADR-006): cart memory
    >=3x its own baseline AND top-3 absolute. container_memory_working_set_bytes is pod-labelled.

chaos_manifest:
  apiVersion: chaos-mesh.org/v1alpha1
  kind: StressChaos
  metadata:
    name: cart-memory-stress-seed42
    namespace: chaos-mesh
  spec:
    mode: all
    selector:
      namespaces:
        - otel-demo
      labelSelectors:
        app.kubernetes.io/component: cart
    stressors:
      memory:
        workers: 1
        size: "200MB"
    duration: "300s"
