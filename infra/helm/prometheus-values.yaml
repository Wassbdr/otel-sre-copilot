# prometheus (standalone) — lightweight for single-node kind on WSL2
# Exposes Prometheus via NodePort 30090 → localhost:9090
# Enables remote_write receiver for OTel Collector

server:
  enabled: true
  remoteWrite: []
  # Accept remote_write from OTel Collector
  extraFlags:
    - web.enable-remote-write-receiver
  retention: "7d"
  service:
    type: NodePort
    nodePort: 30090
  persistentVolume:
    enabled: false   # no PVC on single-node kind (simpler)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: false   # no daemonset on single-node

extraScrapeConfigs: |
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['prometheus-kube-state-metrics.monitoring.svc.cluster.local:8080']

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  - job_name: 'otel-collector-prometheus'
    static_configs:
      - targets: ['otel-collector.monitoring.svc.cluster.local:9464']
